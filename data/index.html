<!DOCTYPE html>
<html lang="en">

<head> 
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">

    <title> WiFiScope </title>
    <link rel = "stylesheet" href = "/style.css">
</head>

<body>
    <h1> WiFiScope </h1>
    <p> Networks Found: <span id= "networks"> --- </span></p>
    <p> Recommended Channel: <span id= "bestChannel"> --= </span></p>
    <p> Congestion-Score : <span id="congestionScore"> -=- </span></p>
    <p> Relative Congestion: <span id="relativeCongestion"> --- </span>%</p>

    <h2> Detected networks </h2>
    <table>
        <thead>
            <tr>
                <th> SSID </th>
                <th> Signal </th>
                <th> RSSI </th>
                <th> Channel </th>
                <th> Security </th>
            </tr>
        </thead>
        <tbody id="networkTable" ></tbody>
    </table>

    <script src = "/script.js"> </script>
</body>

</html>
